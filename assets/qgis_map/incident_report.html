    <!-- Reset GIF Animation -->
    <script>
        // Function to reset GIF animation
        function resetGif() {
            const gif = document.getElementById('loading_gif');
            const src = gif.src;
            gif.src = '';
            gif.src = src + '?t=' + new Date().getTime();
        }

        // Reset GIF on page load
        window.addEventListener('load', resetGif);

        // Reset GIF when showing loader
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.target.classList.contains('loader_hidden')) {
                    // When loader becomes visible again
                    resetGif();
                }
            });
        });

        // Start observing the loader container for class changes
        observer.observe(document.getElementById('loader_container'), {
            attributes: true,
            attributeFilter: ['class']
        });
    </script>

    // Debounce function to limit how often a function can be called
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // Create a ResizeObserver to handle container size changes
    const mapContainer = document.getElementById('resident-map');
    const resizeObserver = new ResizeObserver(debounce(entries => {
        for (let entry of entries) {
            // Get the current center and zoom before resize
            const center = map.getCenter();
            const zoom = map.getZoom();

            // Trigger resize
            map.invalidateSize();

            // Restore the view
            map.setView(center, zoom);
        }
    }, 100)); // Only run every 100ms

    // Start observing the map container
    resizeObserver.observe(mapContainer);

    var userLayer = L.layerGroup().addTo(map); // Layer for user-added markers

    var autolinker = new Autolinker({ truncate: { length: 30, location: 'smart' } });

    // remove popup's row if "visible-with-data"
    function removeEmptyRowsFromPopupContent(content, feature) {
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = content;
        var rows = tempDiv.querySelectorAll('tr');
        for (var i = 0; i < rows.length; i++) {
            var td = rows[i].querySelector('td.visible-with-data');
            var key = td ? td.id : '';
            if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                rows[i].parentNode.removeChild(rows[i]);
            }
        }
        return tempDiv.innerHTML;
    }

    // add class to format popup if it contains media
    function addClassToPopupIfMedia(content, popup) {
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = content;
        if (tempDiv.querySelector('td img')) {
            popup._contentNode.classList.add('media');
            // Delay to force the redraw
            setTimeout(function () {
                popup.update();
            }, 10);
        } else {
            popup._contentNode.classList.remove('media');
        }
    }
    var zoomControl = L.control.zoom({
        position: 'topleft'
    }).addTo(map);
    L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
    var measureControl = new L.Control.Measure({
        position: 'topleft',
        primaryLengthUnit: 'feet',

        primaryAreaUnit: 'sqfeet',
        secondaryAreaUnit: 'sqmiles'

    function setBounds() {
    }

    var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        pane: 'pane_OpenStreetMap_0',
        opacity: 1.0,
        attribution: '',

        tileSize: 512,            // Larger tiles = fewer requests

    });
    // layer_OpenStreetMap_0;
    map.addLayer(layer_OpenStreetMap_0);

    function pop_PG_Brgy_Boundary_Cadastral_edited_1(feature, layer) {
        layer.on({
            mouseout: function (e) {
                for (var i in e.target._eventParents) {
                    if (typeof e.target._eventParents[i].resetStyle === 'function') {
                        e.target._eventParents[i].resetStyle(e.target);
                    }
                }
            },
            mouseover: highlightFeature,
        });
        var popupContent = '<table>\
        <tr>\
            <td colspan="2">' + (feature.properties['Barangay'] !== null ? autolinker.link(String(feature.properties['Barangay']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
        </tr>\
        <tr>\
            <td colspan="2">' + (feature.properties['Area_ha'] !== null ? autolinker.link(String(feature.properties['Area_ha']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
        </tr>\
    </table>';
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.on('popupopen', function (e) {
            addClassToPopupIfMedia(content, e.popup);
        });
        layer.bindPopup(content, { maxHeight: 400 });

    function style_PG_Brgy_Boundary_Cadastral_edited_1_0() {
        return {
            pane: 'pane_PG_Brgy_Boundary_Cadastral_edited_1',
            opacity: 1,
            color: 'rgba(48,18,59,1.0)',
            dashArray: '',
            lineCap: 'square',
            lineJoin: 'bevel',
            weight: 2.0,
            fillOpacity: 0,
            interactive: true,
        }
    }

    map.createPane('pane_PG_Brgy_Boundary_Cadastral_edited_1');
    map.getPane('pane_PG_Brgy_Boundary_Cadastral_edited_1').style.zIndex = 401;
    map.getPane('pane_PG_Brgy_Boundary_Cadastral_edited_1').style['mix-blend-mode'] = 'normal';
    map.getPane('pane_PG_Brgy_Boundary_Cadastral_edited_1').style.willChange = 'transform';

    // Add this variable at the top of your file with other variables
    var activeBarangayLayer = null;

    // Add this near the top of your file with other variables
    const HIGHLIGHT_STYLE = {
        transform: 'translate3d(0,0,0)',
        fillColor: 'rgba(0, 0, 255, 0.4)',
        fillOpacity: 0.5,
        color: 'blue',
        weight: 2
    };

    function zoomToBarangay(e, feature) {
        var barangayName = feature.properties.Barangay || "Unknown Barangay";
        var layer = e.target;

        if (lastClickedBarangay === barangayName) {
            console.log("Already zoomed to this barangay, ignoring.");
            return;
        }

        lastClickedBarangay = barangayName;
        var bounds = layer.getBounds();

        // First pan to the clicked location
        map.panTo(e.latlng, {
            animate: true,
            duration: 0.6,
            easeLinearity: 0.25
        });

        // Then after pan completes, fly to the bounds
        setTimeout(() => {
            map.flyToBounds(bounds, {
                padding: [50, 50],
                maxZoom: 16,
                animate: true,
                duration: 0.6,       // Keep short so it feels like one flow
                easeLinearity: 0.3
            });
        }, 100); // Match delay to pan duration
    }

    // Handle Barangay Boundary Clicks
    var layer_PG_Brgy_Boundary_Cadastral_edited_1 = new L.geoJson(json_PG_Brgy_Boundary_Cadastral_edited_1, {
        attribution: '',
        interactive: true,
        dataVar: 'json_PG_Brgy_Boundary_Cadastral_edited_1',
        layerName: 'layer_PG_Brgy_Boundary_Cadastral_edited_1',
        pane: 'pane_PG_Brgy_Boundary_Cadastral_edited_1',
        style: style_PG_Brgy_Boundary_Cadastral_edited_1_0,
        renderer: L.svg({
            padding: 0.5,
            optimizeSpeed: true,
            vectorEffect: true,
            smoothFactor: 2.0
        }),
        maxZoom: 20,
        smoothFactor: 2.0,  // Reduce number of points rendered
        tolerance: 5,        // Increase tolerance for better performance
        onEachFeature: function (feature, layer) {
            layer.on({
                mouseover: function (e) {
                    if (activeBarangayLayer !== layer) {
                        layer.setStyle(HIGHLIGHT_STYLE);
                    }
                },
                mouseout: function (e) {
                    if (activeBarangayLayer !== layer) {
                        layer.setStyle(style_PG_Brgy_Boundary_Cadastral_edited_1_0());
                    }
                },
                click: function (e) {
                    console.log("Barangay clicked at:", e.latlng);

                    // Reset previous active barangay
                    if (activeBarangayLayer && activeBarangayLayer !== layer) {
                        activeBarangayLayer.setStyle(style_PG_Brgy_Boundary_Cadastral_edited_1_0());
                    }

                    // Set new active barangay
                    activeBarangayLayer = layer;
                    layer.setStyle(HIGHLIGHT_STYLE);

                    zoomToBarangay(e, feature);

                    var lat = e.latlng.lat;
                    var lng = e.latlng.lng;
                    // var streetViewUrl = `https://www.google.com/maps?q=&layer=c&cbll=${lat},${lng}`;
                    // <a href="${streetViewUrl}" target="_blank">📍 View in Google Street View</a>

                    L.popup()
                        .setLatLng(e.latlng)
                        .setContent(`
                    <b>Barangay:</b> ${feature.properties.Barangay || "Unknown Barangay"}<br>
                `)
                        .openOn(map);
                }
            });
        }
    });
    bounds_group.addLayer(layer_PG_Brgy_Boundary_Cadastral_edited_1);
    map.addLayer(layer_PG_Brgy_Boundary_Cadastral_edited_1);

    function style_Buildings_2_0() {
        return {
            pane: 'pane_Buildings_2',
            opacity: 1,
            color: 'rgba(35,35,35,1.0)',
            dashArray: '',
            lineCap: 'butt',
            lineJoin: 'miter',
            weight: 1.0,
            fill: true,
            fillOpacity: 1,
            fillColor: 'rgba(190,178,151,1.0)',
            interactive: true,
            clickable: true,
        }
    }
    map.createPane('pane_Buildings_2');
    map.getPane('pane_Buildings_2').style.zIndex = 403;
    map.getPane('pane_Buildings_2').style['mix-blend-mode'] = 'normal';

    var layer_Buildings_2 = new L.geoJson(json_Buildings_2, {
        attribution: '',
        interactive: true,
        dataVar: 'json_Buildings_2',
        layerName: 'layer_Buildings_2',
        pane: 'pane_Buildings_2',
        // onEachFeature: pop_Buildings_2,
        style: style_Buildings_2_0,
    });
    bounds_group.addLayer(layer_Buildings_2);
    map.addLayer(layer_Buildings_2);
    setBounds();

    var i = 0;
    layer_PG_Brgy_Boundary_Cadastral_edited_1.eachLayer(function (layer) {
        var context = {
            feature: layer.feature,
            variables: {}
        };
        layer.bindTooltip((layer.feature.properties['Barangay'] !== null ? String('<div style="color: #30123b; font-size: 12pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['Barangay']) + '</div>' : ''), { permanent: true, offset: [-0, -16], className: 'css_PG_Brgy_Boundary_Cadastral_edited_1' });
        labels.push(layer);
        totalMarkers += 1;
        layer.added = true;
        addLabel(layer, i);
        i++;
    });

    // map.addControl(new L.Control.Search({
    //     layer: layer_Buildings_2,
    //     initial: false,
    //     hideMarkerOnCollapse: true,
    //     propertyName: 'name',
    //     textPlaceholder: 'Search buildings...',
    // }));

    // document.getElementsByClassName('search-button')[0].className +=
    //     ' fa fa-search';
    var searchMarker = null;
    const searchInput = document.getElementById('search-input');
    const suggestionsBox = document.getElementById('search-suggestions');
    let buildingNames = [];

    document.getElementById('search-btn').onclick = function () {
        const query = document.getElementById('search-input').value.trim().toLowerCase();
        if (!query) {
            suggestionsBox.style.display = 'none';
            return;
        }
        const matches = buildingNames.filter(b => b.name.toLowerCase().includes(query));
        if (matches.length === 0) {
            // Show "No building found." as a suggestion
            suggestionsBox.innerHTML = '';
            const noResultDiv = document.createElement('div');
            noResultDiv.className = 'search-suggestion-item no-result';
            noResultDiv.textContent = 'No building found.';
            noResultDiv.style.color = '#7c7c7c';
            noResultDiv.style.cursor = 'default';
            suggestionsBox.appendChild(noResultDiv);
            suggestionsBox.style.display = 'flex';
            return;
        }
        // If found, trigger the first suggestion's click
        suggestionsBox.querySelector('.search-suggestion-item').click();
    };

    // Optional: Enter key triggers search
    document.getElementById('search-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            document.getElementById('search-btn').click();
        }
    });

    // Collect building names and their layers
    layer_Buildings_2.eachLayer(function (layer) {
        if (layer.feature && layer.feature.properties && layer.feature.properties.name) {
            buildingNames.push({
                name: layer.feature.properties.name,
                layer: layer
            });
        }
    });

    // Show suggestions as user types
    searchInput.addEventListener('input', function () {
        suggestionsBox.innerHTML = '';
        const query = searchInput.value.trim().toLowerCase();

        if (!query) {
            suggestionsBox.style.display = 'none';
            return;
        }
        const matches = buildingNames.filter(b => b.name.toLowerCase().includes(query));
        if (matches.length === 0) {
            // Show "No building found." as a suggestion
            const noResultDiv = document.createElement('div');
            noResultDiv.className = 'search-suggestion-item no-result';
            noResultDiv.textContent = 'No building found.';
            noResultDiv.style.color = '#7c7c7c';
            noResultDiv.style.cursor = 'default';
            suggestionsBox.appendChild(noResultDiv);
            suggestionsBox.style.display = 'flex';
            return;
        }
        matches.forEach(b => {
            const div = document.createElement('div');
            div.className = 'search-suggestion-item';
            div.textContent = b.name;
            div.onclick = function () {
                searchInput.value = b.name;
                suggestionsBox.style.display = 'none';
                map.fitBounds(b.layer.getBounds ? b.layer.getBounds() : b.layer.getLatLng().toBounds(100));
                b.layer.openPopup && b.layer.openPopup();
                b.layer.setStyle && b.layer.setStyle({ color: '#232A67', weight: 3 });
                // --- Add red pinpoint marker ---
                if (window.searchMarker) {
                    map.removeLayer(window.searchMarker);
                }
                let latlng;
                if (b.layer.getBounds) {
                    latlng = b.layer.getBounds().getCenter();
                } else if (b.layer.getLatLng) {
                    latlng = b.layer.getLatLng();
                }
                window.searchMarker = L.circleMarker(latlng, {
                    radius: 10,
                    color: '#d32f2f',
                    fillColor: '#d32f2f',
                    fillOpacity: 1,
                    weight: 2
                }).addTo(map);
                // Remove the marker after 1.5 seconds
                setTimeout(() => {
                    if (window.searchMarker) {
                        map.removeLayer(window.searchMarker);
                        window.searchMarker = null;
                    }
                }, 1500);
                setTimeout(() => {
                    b.layer.setStyle && b.layer.setStyle(style_Buildings_2_0());
                }, 2000);
            };
            suggestionsBox.appendChild(div);
        });
        suggestionsBox.style.display = 'flex';
    });

    // Hide suggestions when clicking outside
    document.addEventListener('click', function (e) {
        if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
            suggestionsBox.style.display = 'none';
        }
    });

    window.isIncidentFormOpen = false;
    window.geolocateMarker = null;
    window.geolocateRequestActive = false;
    
    // Helper to find barangay for a given lat/lng
    function getBarangayForLatLng(lat, lng) {
        let foundBarangay = null;
        layer_PG_Brgy_Boundary_Cadastral_edited_1.eachLayer(function (layer) {
            if (layer.feature && layer.feature.geometry) {
                var point = turf.point([lng, lat]);
                var polygon = layer.feature;
                if (turf.booleanPointInPolygon(point, polygon)) {
                    foundBarangay = layer.feature.properties.Barangay || "Unknown";
                }
            }
        });
        return foundBarangay;
    }

    // Listen for location found (from the location control)
    map.on('locationfound', function(e) {
        var lat = e.latitude || e.latlng.lat;
        var lng = e.longitude || e.latlng.lng;
        var barangay = getBarangayForLatLng(lat, lng);

        // Remove previous geolocate marker if any
        if (window.geolocateMarker) {
            map.removeLayer(window.geolocateMarker);
            window.geolocateMarker = null;
        }

        // Add a default Leaflet marker at the geolocated position
        // window.geolocateMarker = L.marker([lat, lng]).addTo(map);

        // Only show the form if geolocateRequestActive is true
        if (window.geolocateRequestActive) {
            if (barangay) {
                if (!window.isIncidentFormOpen && window.flutter_inappwebview) {
                    window.isIncidentFormOpen = true;
                    window.flutter_inappwebview.callHandler('onMapClick', lat, lng, barangay);
                }
            } else {
                Swal.fire({
                    toast: true,
                    position: 'top',
                    icon: 'error',
                    title: "Your location is outside the Padre Garcia boundary.",
                    showConfirmButton: false,
                    timer: 2000,
                    timerProgressBar: true,
                    customClass: { popup: 'swal2-geo-tooltip' }
                });
            }
            window.geolocateRequestActive = false; // Reset so it only triggers once per button click
        }

        // Remove the location marker after use (from locate plugin)
        if (map._locateMarker) {
            map.removeLayer(map._locateMarker);
            map._locateMarker = null;
        }
    });

    // Remove the geolocate marker when the form is closed (Flutter should call this)
    window.removeGeolocateMarker = function() {
        if (window.geolocateMarker) {
            map.removeLayer(window.geolocateMarker);
            window.geolocateMarker = null;
        }
    };
    
    // Optionally, hide the location marker after the form is opened
    map.on('locationfound', function(e) {
        // Remove the marker after a short delay (or immediately)
        setTimeout(function() {
            if (map._locateMarker) {
                map.removeLayer(map._locateMarker);
                map._locateMarker = null;
            }
        }, 500);
    });


    map.on('click', function (e) {
        var lat = e.latlng.lat;
        var lng = e.latlng.lng;
        // var foundBarangay = null;
        var foundBarangay = getBarangayForLatLng(lat, lng);

        // Remove the marker when the user clicks on the map to pick a new location
        if (window.geolocateMarker) {
            map.removeLayer(window.geolocateMarker);
            window.geolocateMarker = null;
        }

        // Loop through each barangay polygon to check if the point is inside
        layer_PG_Brgy_Boundary_Cadastral_edited_1.eachLayer(function (layer) {
            if (layer.feature && layer.feature.geometry) {
                var point = turf.point([lng, lat]);
                var polygon = layer.feature;
                if (turf.booleanPointInPolygon(point, polygon)) {
                    foundBarangay = layer.feature.properties.Barangay || "Unknown";
                }
            }
        });

        if (foundBarangay) {
            // Only call Flutter if inside a barangay
            if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler('onMapClick', lat, lng, foundBarangay);
            }
        } else {
            // Show error if outside boundary
            Swal.fire({
                toast: true,
                position: 'top',
                icon: 'error',
                title: "Please click inside the Padre Garcia boundary.",
                showConfirmButton: false,
                timer: 2000,
                timerProgressBar: true,
                customClass: { popup: 'swal2-geo-tooltip' }
            });
        }
    });
    
    // Update the locate control to show form when location is inside boundary
    // --- BEGIN: Robust Incident Report Logic (from report_incidents.js) ---

    window.activeMarkers = new Map();

    window.saveUserReportToLocalStorage = function(report) {
        let localReports = JSON.parse(localStorage.getItem("citizenReports") || "[]");
        // Remove if already exists (by id)
        localReports = localReports.filter(r => r.id !== report.report_id && r.id !== report.id);
        // Add new report (normalize keys)
        localReports.push({
            id: report.report_id || report.id,
            latitude: report.latitude,
            longitude: report.longitude,
            description: report.description,
            barangay: report.barangay || report.baranggay,
            photo: report.photo,
            status: report.status,
            date: report.date,
            time: report.time
        });
        localStorage.setItem("citizenReports", JSON.stringify(localReports));
        // Log to console for verification
        console.log(
          "citizenReports in localStorage:\n",
          JSON.stringify(JSON.parse(localStorage.getItem("citizenReports") || "[]"), null, 2)
        );    
    };

    function loadUserReports() {
        // 1. Get user's reports from localStorage
        let localReports = JSON.parse(localStorage.getItem("citizenReports") || "[]");  

        if (localReports.length === 0) {
            window.activeMarkers.forEach(marker => map.removeLayer(marker));
            window.activeMarkers.clear();
            return;
        }

        // 2. Get their IDs
        const reportIds = localReports.map(report => report.id);
    
        // 3. Fetch their current status from the DB
        fetch(`http://192.168.1.10/Capstone-MDRRMO/php/reportings/citizens_reports/check_reports_status.php?ids=${reportIds.join(',')}`)
            .then(response => response.json())
            .then(dbReports => {
                // Log current local reports for debugging
                console.log(
                "Current citizenReports in localStorage:\n",
                JSON.stringify(JSON.parse(localStorage.getItem("citizenReports") || "[]"), null, 2)
                );  

                // 4. Remove deleted reports from localStorage
                const validReportIds = new Set(dbReports.map(r => r.report_id));
                localReports = localReports.filter(r => validReportIds.has(r.id));
    
                // 5. Update local reports with latest status from DB
                localReports = localReports.map(localReport => {
                    const dbReport = dbReports.find(r => r.report_id === localReport.id);
                    if (dbReport) {
                        return {
                            ...localReport,
                            status: dbReport.status,
                            // Optionally update other fields from DB if needed
                            latitude: dbReport.latitude,
                            longitude: dbReport.longitude,
                            barangay: dbReport.barangay,
                            description: dbReport.description,
                            date: dbReport.date,
                            time: dbReport.time
                        };
                    }
                    return localReport;
                });
    
                // 6. Save updated reports back to localStorage
                localStorage.setItem("citizenReports", JSON.stringify(localReports));

                // 7. Remove all existing markers
                for (let [reportId, marker] of window.activeMarkers) {
                    map.removeLayer(marker);
                }
                window.activeMarkers.clear();
    
                // 8. Only display markers for user's reports that are "Active"
                localReports.forEach(report => {
                    if (
                        report.status === 'Active' &&
                        report.latitude && report.longitude &&
                        !isNaN(parseFloat(report.latitude)) && !isNaN(parseFloat(report.longitude))
                    ) {
                        const reportId = report.id ? report.id.toString() : Math.random().toString();
                        const popupContent = `
                            <div style="padding: 14px 10px 10px 10px; min-width: 220px;">
                                <div style="font-weight:bold; font-size: 15px; margin-bottom: 8px; color: #232A67;">
                                    ${report.description || ''}
                                </div>
                                <div style="margin-bottom: 6px;">
                                    <span style="font-weight:600; color:#555;">Barangay:</span>
                                    <span style="color:#232A67;">${report.barangay || ''}</span>
                                </div>
                                <div style="margin-bottom: 6px;">
                                    <span style="font-weight:600; color:#555;">Lat:</span>
                                    <span style="color:#232A67;">${parseFloat(report.latitude).toFixed(6)}</span>
                                </div>
                                <div style="margin-bottom: 6px;">
                                    <span style="font-weight:600; color:#555;">Lng:</span>
                                    <span style="color:#232A67;">${parseFloat(report.longitude).toFixed(6)}</span>
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <span style="font-weight:600; color:#555;">Status:</span>
                                    <span style="color:#388e3c;">${report.status || ''}</span>
                                </div>
                                <button 
                                    style="margin-top:8px;width:100%;background:#4f46e5;color:white;padding:8px 0;border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:14px;"
                                    onclick="editReportFromMarker('${reportId}', '${report.latitude}', '${report.longitude}', '${report.barangay}', \`${(report.description || '').replace(/`/g, '\\`')}\`, '${report.photo || ''}', '${report.barangay}')">
                                    <i class="fa fa-edit" style="margin-right:6px"></i>Update Report
                                </button>
                            </div>
                        `;
                        const marker = L.marker([parseFloat(report.latitude), parseFloat(report.longitude)])
                            .addTo(map)
                            .bindPopup(popupContent, {
                                closeButton: true,
                                closeOnClick: false,
                                autoClose: false,
                            });
                        window.activeMarkers.set(reportId, marker);
                    }
                });
            })
            .catch(error => {
                console.error("Error fetching reports:", error);
            });
    }
    
    // Called by Flutter after submit/edit to trigger reload
    window.setFlutterReports = function() {
        loadUserReports();
    };
    
    // On page load and every 3 seconds, sync and display
    document.addEventListener('DOMContentLoaded', loadUserReports);
    setInterval(loadUserReports, 3000);
    
    function editReportFromMarker(id, latitude, longitude, barangay, description, photo, originalBarangay) {
        if (window.flutter_inappwebview) {
            window.flutter_inappwebview.callHandler(
                'onEditReport',
                parseInt(id),
                parseFloat(latitude),
                parseFloat(longitude),
                barangay,
                description,
                photo,
                originalBarangay
            );
        }
        map.closePopup();
    }

    // loading....
    document.addEventListener('DOMContentLoaded', function () {
        // Call once on load
        // loadReports();

        // Listen for the locate control button click
        const locateBtn = document.querySelector('.leaflet-control-locate a');
        if (locateBtn) {
            locateBtn.addEventListener('click', function() {
                window.geolocateRequestActive = true;
            });
        }

        var loadingCheck = setInterval(function () {
            if (document.readyState === 'complete') {
                document.getElementById('loader_container').classList.add('loader_hidden');
                clearInterval(loadingCheck);
            }
        }, 100);

        setTimeout(function () {
            document.getElementById('loader_container').classList.add('loader_hidden');
            clearInterval(loadingCheck);
        }, 5000);
    });
</script>
