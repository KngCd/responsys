name: responsys
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.6+8

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  # webview_flutter: ^4.2.2
  # webview_flutter_android: ^3.10.0
  # webview_flutter_wkwebview: ^3.10.0
  flutter_inappwebview: ^6.0.0
  permission_handler: ^12.0.0+1
  image_picker: ^1.0.7
  http: ^1.4.0
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  # geocoding: ^3.0.0
  image: ^4.1.3
  intl: ^0.20.2
  path_provider: ^2.1.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/qgis_map/
    - assets/qgis_map/css/
    - assets/qgis_map/css/images/
    - assets/qgis_map/js/
    - assets/qgis_map/images/
    - assets/qgis_map/data/
    - assets/qgis_map/legend/
    - assets/qgis_map/webfonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"